name: Deploy to Network Solutions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Remove files not needed on server
      run: |
        rm -rf ".git" ".github" ".claude" "Jim's Assets" node_modules
        rm -f README.md CLAUDE.md .gitignore

    - name: Deploy via SFTP
      env:
        SFTP_SERVER: ${{ secrets.FTP_SERVER }}
        SFTP_USER: ${{ secrets.FTP_USERNAME }}
        SFTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq lftp
        lftp -u "$SFTP_USER","$SFTP_PASS" sftp://"$SFTP_SERVER" -e "
          set sftp:auto-confirm yes;
          set ssl:verify-certificate no;
          mirror --reverse --verbose --no-perms . /;
          bye
        "
